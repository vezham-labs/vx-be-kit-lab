name: Workspace QA
on:
  pull_request:
  push:
    branches: [timeline, 'feat**', 'fix**', 'next**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tamizhi
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tamizhi
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NX_NO_CLOUD: 'true'
      TAMIZHI_TEST_POSTGRES_URL: postgres://tamizhi:test-only-password@localhost:5432/tamizhi?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:go
      - run: pnpm nx run-many -t build,test,lint,typecheck --parallel=2
      - run: pnpm nx run tamizhi-contracts-go:check-contracts
      - run: pnpm nx run @vx:format-check
      - run: docker build -t tamizhi-api:qa .
