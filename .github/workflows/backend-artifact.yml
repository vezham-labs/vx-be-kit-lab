name: Backend release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:go
      - run: pnpm nx run-many -t build,test,lint
      - run: pnpm nx run tamizhi-contracts-go:check-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: tamizhi-api-linux
          path: dist/tamizhi-api
